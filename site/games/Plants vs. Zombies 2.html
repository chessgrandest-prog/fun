<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base href="https://cdn.jsdelivr.net/gh/Gzh0821/pvzge_web/docs/">
  <title>Plants vs. Zombies Web Port (Latest)</title>
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script>
    // Force crossOrigin on all images created by the game
    (function() {
      const originalImage = window.Image;
      window.Image = function() {
        const img = new originalImage();
        img.crossOrigin = 'anonymous';
        return img;
      };
    })();
    // Tell Cocos that assets are on a CDN (optional but helpful)
    window._CCSettings = window._CCSettings || {};
    window._CCSettings.assetBase = 'https://cdn.jsdelivr.net/gh/Gzh0821/pvzge_web/docs/';
  </script>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" tabindex="99"></canvas>
    </div>
  </div>

  <!-- Polyfills (note: exact filenames from the repo) -->
  <script src="src/polyfills.bundle.js" charset="utf-8"></script>
  <!-- SystemJS -->
  <script src="src/system.bundle.js" charset="utf-8"></script>
  <!-- Import map -->
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
  <!-- Start the game -->
  <script>
    System.import('./index.js').catch(err => console.error(err));
  </script>
  <!-- Temporary patch (if present) -->
  <script src="tmpPatch.js"></script>
</body>
</html>
