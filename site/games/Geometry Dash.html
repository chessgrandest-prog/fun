<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Dashers</title>
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/style.css">

    <!-- - Embeds - -->
    <!-- Open Graph -->
    <meta property="og:title" content="Web Dash"/>
    <meta property="og:description" content="A mod of geometrydash.com!"/>
    <meta property="og:image" content="https://web-dashers.github.io/assets/logo.png"/>
    <meta property="og:url" content="https://web-dashers.github.io/"/>
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Web Dash"/>
    <meta name="twitter:description" content="A mod of geometrydash.com!"/>
    <meta name="twitter:image" content="https://web-dashers.github.io/assets/logo.png"/>
    
    <!-- ==================== CDN-LOADED GAME SCRIPTS ==================== -->
    <!-- Load core libraries from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

    <!-- Load all custom game scripts from jsDelivr GitHub CDN -->
    <!-- Game data -->
    <script src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/game/allObjects.js?latest"></script>
    <script src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/game/allLevels.js"></script>
    
    <!-- Utilities & API -->
    <script src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/utils/cache-manager.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/api/GDapiWrapper.js"></script>
    <script>window._gdProxyUrl = "https://gd-proxy.gmdc.workers.dev";</script>
    
    <!-- Core game logic -->
    <script defer src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/utils/config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/core/triggers.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/core/level.js?latest"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/core/player.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/core/audio.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/core/loading-screen.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/core/game-scene.js?latest"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/web-dashers/web-dashers.github.io@f3bb02e0391681bf64068485838185984f0e4b99/assets/scripts/core/main.js"></script>
    <script>
        new ResizeObserver(() => {
            window.dispatchEvent(new Event('resize'));
        }).observe(document.documentElement);
        
        document.oncontextmenu = (event) => {
            event.preventDefault();
        };
    </script>
</head>

<body>
    <!-- Game container – required for the game to attach to the DOM -->
    <div id="game-container"></div>
</body>

</html>
